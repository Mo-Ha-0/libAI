<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>
  </defs>
  <rect width="700" height="300" rx="12" fill="url(#bg)"/>
  <text x="350" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Tensor Operations</text>

  <!-- Element-wise -->
  <rect x="30" y="60" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g1)" stroke-width="1.5"/>
  <text x="180" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d2ff" text-anchor="middle">Element-wise Ops</text>
  <text x="180" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">add, sub, mul, div, pow, exp, log</text>

  <!-- Reductions -->
  <rect x="370" y="60" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g2)" stroke-width="1.5"/>
  <text x="520" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f7971e" text-anchor="middle">Reductions</text>
  <text x="520" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">sum, mean, max, min (along axis)</text>

  <!-- Matmul -->
  <rect x="30" y="140" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g1)" stroke-width="1.5"/>
  <text x="180" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d2ff" text-anchor="middle">Matrix Multiply</text>
  <text x="180" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">optimized O(n³) with OpenMP</text>

  <!-- Broadcasting -->
  <rect x="370" y="140" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g2)" stroke-width="1.5"/>
  <text x="520" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f7971e" text-anchor="middle">Broadcasting</text>
  <text x="520" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">2D + 1D automatic broadcasting</text>

  <!-- Transpose -->
  <rect x="30" y="220" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g1)" stroke-width="1.5"/>
  <text x="180" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d2ff" text-anchor="middle">Transpose &amp; Reshape</text>
  <text x="180" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">full transpose, axis permutation</text>

  <!-- Random Init -->
  <rect x="370" y="220" width="300" height="60" rx="8" fill="#1a1a3e" stroke="url(#g2)" stroke-width="1.5"/>
  <text x="520" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f7971e" text-anchor="middle">Random Initializers</text>
  <text x="520" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667799" text-anchor="middle">normal, uniform, glorot, he</text>
</svg>
