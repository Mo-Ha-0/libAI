  <!-- Text -->
  <text x="230" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">lib</text>
  <text x="290" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)">AI</text>
  <text x="230" y="135" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8899bb">High-Performance C++ Neural Network Library</text>
  <text x="230" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#667799">OpenMP · pybind11 · Keras-like API</text>
  <!-- Version badge -->
  <rect x="430" y="75" rx="8" ry="8" width="48" height="24" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="454" y="91" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="url(#accent)" text-anchor="middle" font-weight="bold">v1.0</text>
  <!-- Python badge -->
  <rect x="486" y="75" rx="8" ry="8" width="80" height="24" fill="none" stroke="url(#accent2)" stroke-width="1.5"/>
  <text x="526" y="91" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="url(#accent2)" text-anchor="middle" font-weight="bold">Python 3.8+</text>
